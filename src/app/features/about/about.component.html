<section id="about" class="bg-white pb-25 pt-10 text-zinc-950 dark:bg-zinc-950 dark:text-white">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <!-- Heading -->
    <div class="max-w-2xl">
      <p
        class="mb-4 text-sm font-semibold uppercase tracking-[0.2em] text-zinc-500 dark:text-zinc-400"
      >
        {{ t().about.label }}
      </p>

      <h2 class="text-4xl font-bold tracking-tight sm:text-5xl">
        {{ t().about.title }}
      </h2>
    </div>

    <!-- Content -->
    <div appReveal class="mt-16 grid gap-16 lg:grid-cols-[1.2fr_0.8fr] reveal">
      <!-- Introduction -->
      <div class="space-y-6">
        <p class="text-xl leading-9 text-zinc-700 dark:text-zinc-300">
          {{ t().about.introduction }}
        </p>

        <p class="leading-8 text-zinc-600 dark:text-zinc-400">
          {{ t().about.architecture }}
        </p>

        <p class="leading-8 text-zinc-600 dark:text-zinc-400">
          {{ t().about.focus }}
        </p>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-3 lg:grid-cols-1">
        @for (stat of stats(); track stat.labelKey) {
          <div
            class="about-card rounded-2xl border border-zinc-200 bg-zinc-50 p-6 dark:border-zinc-800 dark:bg-zinc-900"
          >
            <p class="text-lg font-semibold">
              {{ stat.value }}
            </p>

            <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">
              {{ t().about.stats[stat.labelKey] }}
            </p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
