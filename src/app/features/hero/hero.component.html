<section
  id="home"
  class="relative min-h-screen overflow-hidden bg-white text-zinc-950 dark:bg-zinc-950 dark:text-white"
>
  <!-- Star animation -->
  <div class="pointer-events-none absolute inset-0" aria-hidden="true">
    <app-universe />
  </div>

  <!-- Content -->
  <div
    class="hero-content relative z-10 mx-auto flex min-h-screen max-w-7xl items-center px-6 pb-20 pt-32 lg:px-8"
  >
    <div class="max-w-4xl">
      <p
        class="hero-item mb-6 text-sm font-semibold uppercase tracking-[0.2em] text-zinc-500 dark:text-zinc-400"
      >
        {{ t().hero.role }}
      </p>

      <h1
        class="hero-item max-w-4xl text-5xl font-extrabold leading-[1.05] tracking-tight sm:text-6xl lg:text-8xl"
      >
        {{ t().hero.title.before }}
        <span class="text-zinc-400 dark:text-zinc-600">
          {{ t().hero.title.highlight }}
        </span>
        {{ t().hero.title.after }}
      </h1>

      <p
        class="hero-item mt-8 max-w-2xl text-lg leading-8 text-zinc-600 dark:text-zinc-400 sm:text-xl"
      >
        {{ t().hero.description }}
      </p>

      <div class="hero-item mt-10 flex flex-wrap gap-4">
        <a
          href="#projects"
          class="inline-flex items-center rounded-full bg-zinc-950 px-6 py-3 text-sm font-semibold text-white transition duration-200 hover:-translate-y-0.5 hover:bg-zinc-800 dark:bg-white dark:text-zinc-950 dark:hover:bg-zinc-200"
        >
          {{ t().hero.viewWork }}
        </a>

        <a
          href="#contact"
          class="inline-flex items-center rounded-full border border-zinc-300 px-6 py-3 text-sm font-semibold text-zinc-900 transition duration-200 hover:-translate-y-0.5 hover:bg-zinc-100 dark:border-zinc-700 dark:text-white dark:hover:bg-zinc-900"
        >
          {{ t().hero.getInTouch }}
        </a>
      </div>
    </div>
  </div>
</section>
