<nav
  class="fixed inset-x-0 top-0 z-50 border-b border-zinc-200/60 bg-white/70 backdrop-blur-xl dark:border-zinc-800/60 dark:bg-zinc-950/70"
>
  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6 lg:px-8">
    <!-- Logo -->
    <a href="#" class="text-lg font-extrabold tracking-tight text-zinc-950 dark:text-white">
      UKTAM<span class="text-zinc-400">.</span>
    </a>

    <!-- Desktop navigation -->
    <div class="hidden items-center gap-8 md:flex">
      @for (item of navbarItems(); track item.href) {
        <a
          [class.active]="item.href.substring(1) === activeSection()"
          [href]="item.href"
          class="text-sm font-medium text-zinc-600 transition-colors hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white"
        >
          {{ t().nav[item.translationKey] }}
        </a>
      }

      <div class="flex items-center gap-2">
        <button
          type="button"
          class="text-gray-500 cursor-pointer"
          (click)="setLanguage('en')"
          [class.font-bold]="language() === 'en'"
          [class.opacity-50]="language() !== 'en'"
        >
          EN
        </button>

        <span class="text-zinc-300 dark:text-zinc-700">/</span>

        <button
          type="button"
          class="text-gray-500 cursor-pointer"
          (click)="setLanguage('ru')"
          [class.font-bold]="language() === 'ru'"
          [class.opacity-50]="language() !== 'ru'"
        >
          RU
        </button>
      </div>

      <app-theme-toggle />
    </div>

    <!-- Mobile menu button -->
    <button
      type="button"
      class="inline-flex h-10 w-10 items-center justify-center rounded-xl text-zinc-700 transition-colors hover:bg-zinc-100 hover:text-zinc-950 md:hidden dark:text-zinc-300 dark:hover:bg-zinc-900 dark:hover:text-white"
      (click)="isMobileMenuOpen.set(!isMobileMenuOpen())"
      aria-label="Toggle navigation menu"
    >
      <i
        [class]="isMobileMenuOpen() ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'"
        aria-hidden="true"
      ></i>
    </button>
  </div>

  <!-- Mobile navigation -->
  @if (isMobileMenuOpen()) {
    <div
      class="border-t border-zinc-200 bg-white/95 px-6 py-6 shadow-lg backdrop-blur-xl md:hidden dark:border-zinc-800 dark:bg-zinc-950/95"
    >
      <div class="mx-auto max-w-7xl">
        <div class="flex flex-col gap-2">
          @for (item of navbarItems(); track item.href) {
            <a
              [href]="item.href"
              [class.active]="item.href.substring(1) === activeSection()"
              (click)="isMobileMenuOpen.set(false)"
              class="rounded-xl px-4 py-3 text-sm font-medium text-zinc-600 transition-colors hover:bg-zinc-100 hover:text-zinc-950 dark:text-zinc-400 dark:hover:bg-zinc-900 dark:hover:text-white"
            >
              {{ t().nav[item.translationKey] }}
            </a>
          }
        </div>
        <div
          class="flex items-center gap-2 mt-4 border-t border-zinc-200 pt-5 dark:border-zinc-800"
        >
          <div class="me-4">
            <app-theme-toggle />
          </div>
          <div class="flex items-center gap-2">
            <button
              type="button"
              class="text-gray-500 cursor-pointer"
              (click)="setLanguage('en')"
              [class.font-bold]="language() === 'en'"
              [class.opacity-50]="language() !== 'en'"
            >
              EN
            </button>

            <span class="text-zinc-300 dark:text-zinc-700">/</span>

            <button
              type="button"
              class="text-gray-500 cursor-pointer"
              (click)="setLanguage('ru')"
              [class.font-bold]="language() === 'ru'"
              [class.opacity-50]="language() !== 'ru'"
            >
              RU
            </button>
          </div>
        </div>
      </div>
    </div>
  }
</nav>
